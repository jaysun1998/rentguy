# Railway deployment configuration for RentGuy with Nginx

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
restartPolicyType = "always"

# Note: Environment variables should be set in Railway dashboard
# Required variables:
# - DATABASE_URL (auto-injected from linked PostgreSQL)
# - SECRET_KEY
# - FIRST_SUPERUSER_PASSWORD
# - ENVIRONMENT=production
# - BACKEND_CORS_ORIGINS
